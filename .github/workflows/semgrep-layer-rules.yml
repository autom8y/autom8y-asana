name: Semgrep layer rules
run-name: "Semgrep layer rules [${{ github.event.pull_request.number || github.sha }}]"

# Runs the repo's .semgrep.yml (layer-boundary rules, e.g. autom8y.asana-no-lower-imports-api)
# on every pull request and every push to main. Before this workflow the rules ran only in the
# pre-commit hook, so violations could land unseen. Scope is the repo root, the same scan the
# pre-commit hook performs: the layer rules are path-restricted to src/autom8_asana, but other
# rules (e.g. the logger rule) apply repo-wide, so scanning only src/ would miss them.
# semgrep is pinned; bump the version deliberately, not by drift.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-layer-rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep layer rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Run semgrep layer rules
        run: >-
          uvx --from semgrep==1.178.0
          semgrep --config .semgrep.yml --error --metrics=off --disable-version-check .
