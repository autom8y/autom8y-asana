name: Secrets Scan (Gitleaks)

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    uses: autom8y/autom8y-workflows/.github/workflows/security-gitleaks.yml@b210b5b6bdcc407e8580e6176c475c7d08ac9ef5
