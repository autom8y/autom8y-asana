name: Secrets Scan (Gitleaks)

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    uses: autom8y/autom8y-workflows/.github/workflows/security-gitleaks.yml@6753f943212f7c3b63658ac700f6d8194771cd1b
