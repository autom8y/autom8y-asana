name: Secrets Scan (Gitleaks)

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    uses: autom8y/autom8y-workflows/.github/workflows/security-gitleaks.yml@85788942be23761f7d0f647193bda9d7f8bc3d6c
