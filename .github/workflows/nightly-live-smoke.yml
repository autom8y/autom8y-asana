# Nightly live-smoke forcing function (CHANGE-001)
#
# WHY THIS EXISTS — forcing-function intent:
#   The repo carries two READ-ONLY live-smoke suites that prove the durable
#   task-cache reader and the null_number_recovery cold-read cure can recover a
#   known-populated unit (gid 1207519540893045 -> MRR 1500) THROUGH THEIR REAL
#   boto3 GET + json parse + envelope unwrap against live S3. In the standard
#   `Test` workflow they are skip-gated on `ASANA_CACHE_S3_BUCKET` + AWS creds so
#   the unit suite stays hermetic — which means in CI they SKIP, every run,
#   forever. With zero forcing-function references they can rot silently: the
#   integration-boundary-fidelity Layer-4 hole the eunomia stub-theater plan
#   names as the §6 PERMANENT-SKIP-RISK (CHANGE-001 in
#   .ledge/specs/PLAN-eunomia-stub-theater-remediation-2026-06-10.md).
#
#   This nightly job is that forcing function. It assumes an OIDC role, sets the
#   skip-gate env so the smokes actually RUN, and HARD-FAILS if the suite
#   reports a SKIP (a nightly that silently skips is theater, not a gate).
#
# ANTI-THEATER ASSERTION:
#   The final step greps the pytest summary and fails the job if it sees any
#   "skipped" outcome or fewer than the expected number of `passed` tests.
#   "0 errors, all green" with a silent skip is treated as FAILURE.
#
# ON FAILURE: this workflow fails loudly (red in the Actions tab) AND pages the
#   fleet alert route (see PAGE-ON-RED below). The red-60-nights-unpaged era
#   (2026-06-11 -> 2026-08-14) is over: a red run is no longer a signal only to
#   whoever happens to open the Actions tab.
#
# ROOT CAUSE OF THE 60-NIGHT RED (fixed 2026-08-14, nightly-smoke-resurrection):
#   NOT the OIDC exchange and NOT the predicted IAM AccessDenied. The
#   `autom8y-config` package registers a pytest11 plugin whose AUTOUSE fixture
#   `config_clean_env` (autom8y_config/testing/fixtures.py) deletes every
#   `AWS_*` env var at EVERY test's setup for hermetic-config isolation. The
#   OIDC step exported valid credentials into the job env (verified in run logs:
#   the CodeArtifact step authenticated with them), the smokes' import-time skip
#   gate saw them and RAN — and then the fixture deleted them before the first
#   boto3 call, so signing found no credentials at all: the exact
#   `NoCredentialsError` on every nightly since inception. On workstations the
#   same deletion is MASKED: botocore falls through to the developer's ~/.aws
#   SSO profile (the fixture scrubs env, not the shared-config chain), so the
#   smokes pass locally — phantom green over the same defect.
#   CURE (two legs, both in this file):
#     1. `-p no:autom8y_config` on the pytest invocation. The nightly is the
#        repo's DESIGNATED non-hermetic run; the hermeticity plugin is
#        semantically wrong here. The `Test` workflow keeps it.
#     2. CRED-BRIDGE (operator-ruled for this lane, nightly-smoke-resurrection
#        brief 2026-08-14: "cred-bridge supersedes OIDC where that scar
#        applies" — no fleet doc names the pattern; the mechanism below is
#        anchored directly): the OIDC `github-actions-deploy` role's S3
#        grant is vendor-scoped only (verified live 2026-08-14: sole S3 stmt =
#        `autom8y-terraform/duckdb-extensions/*`), so with credentials fixed the
#        smoke would hit the header-predicted AccessDenied next. The role
#        carries `secretsmanager:GetSecretValue` on the `autom8_env` CI secret
#        (inline Sid `CIReadAutom8EnvSecret` — provisioned for exactly this
#        bridge); the smoke runs with the bridged pair from that secret, whose
#        principal holds the durable-cache read (HEAD-verified against the live
#        smoke object 2026-08-14).
#   DURABLE SUCCESSOR (unchanged, tracked against the autom8y#481 IAM
#   substrate): a read-only `autom8-s3/asana-cache/tasks/*` grant on
#   `github-actions-deploy` (or a dedicated OIDC smoke role wired via the
#   `LIVE_SMOKE_ROLE` repo variable). When that lands, delete the cred-bridge
#   step and the bridged env on the smoke step; `-p no:autom8y_config` stays.
#
# PAGE-ON-RED (meta-gap cure): 60 red nights paged NOBODY because a scheduled
#   run's failure notifies only Actions-tab watchers — the fleet's live alert
#   route (SNS autom8y-platform-alerts -> Slack + email) never heard of it. The
#   final `if: failure()` step publishes there via the same cred-bridge.
#   HONEST LIMIT: a failure BEFORE the cred-bridge step (checkout, OIDC
#   exchange itself) has no credentials to page with — that residual window is
#   accepted and owned by the /sre lane; if it recurs, the durable fix is a
#   CloudWatch-side dead-man on this workflow's green heartbeat, not more
#   in-job wiring.

name: Nightly Live Smoke

on:
  schedule:
    # 09:15 UTC daily — offset off the busy :00 to dodge runner contention.
    - cron: '15 9 * * *'
  workflow_dispatch: {}

concurrency:
  group: nightly-live-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-smoke:
    name: Live read-only S3 smoke (forcing function)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # OIDC role assumption
      contents: read
    env:
      # Satisfy the smokes' skip gate (_HAS_LIVE_S3): a real bucket + AWS creds.
      # Creds come from the OIDC assume-role step below. Bucket is overridable
      # via a repo variable; defaults to the live durable-cache bucket.
      ASANA_CACHE_S3_BUCKET: ${{ vars.ASANA_CACHE_S3_BUCKET || 'autom8-s3' }}
      AWS_REGION: us-east-1
      AUTOM8Y_ENV: test
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24)
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0 (node24)
        with:
          python-version: '3.12'

      - name: Configure AWS credentials (OIDC)
        # Mirrors the Test workflow's AWS auth: assume the github-actions-deploy
        # role via OIDC (trust permits repo:autom8y/autom8*:*). Overridable via
        # the LIVE_SMOKE_ROLE repo variable for a future dedicated read-only role.
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0 (node24)
        with:
          role-to-assume: ${{ vars.LIVE_SMOKE_ROLE || format('arn:aws:iam::{0}:role/github-actions-deploy', vars.AWS_ACCOUNT_ID) }}
          aws-region: us-east-1

      - name: Cred-bridge — fetch the CI service credentials
        # Cred-bridge, operator-ruled for this lane (see ROOT CAUSE header,
        # leg 2). The OIDC role can read the
        # `autom8_env` CI secret (Sid CIReadAutom8EnvSecret) but NOT the
        # durable-cache S3 path; the bridged pair from the secret can. Values
        # are masked BEFORE leaving this step and travel via step outputs, not
        # the job env, so only the smoke + page steps see them.
        id: credbridge
        run: |
          SECRET_JSON="$(aws secretsmanager get-secret-value \
            --secret-id autom8_env --query SecretString --output text \
            --cli-connect-timeout 15 --cli-read-timeout 30)"
          BRIDGE_KEY="$(jq -r '.AWS_ACCESS_KEY_ID // empty' <<<"$SECRET_JSON")"
          BRIDGE_SECRET="$(jq -r '.AWS_SECRET_ACCESS_KEY // empty' <<<"$SECRET_JSON")"
          if [ -z "$BRIDGE_KEY" ] || [ -z "$BRIDGE_SECRET" ]; then
            echo "::error::cred-bridge: autom8_env is missing AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY — bridge broken, smoke cannot run"
            exit 1
          fi
          echo "::add-mask::$BRIDGE_KEY"
          echo "::add-mask::$BRIDGE_SECRET"
          {
            echo "key=$BRIDGE_KEY"
            echo "secret=$BRIDGE_SECRET"
          } >> "$GITHUB_OUTPUT"

      - name: Login to CodeArtifact
        run: |
          # Retry the token fetch (CodeArtifact connect-timeout flake class):
          # a bare `aws codeartifact get-authorization-token` with no retry/timeouts
          # exits 255 on a connect-timeout and kills the job PRE-check. 3 attempts
          # x 5s backoff, with explicit CLI connect/read timeouts so a stuck
          # connection FAILS FAST into the retry instead of hanging. The `if` guard
          # keeps the loop alive under `set -e`; a final non-empty assertion
          # HARD-FAILS so a genuinely unreachable CodeArtifact still blocks.
          CODEARTIFACT_AUTH_TOKEN=""
          for attempt in 1 2 3; do
            if CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
              --domain autom8y --domain-owner 696318035277 \
              --query authorizationToken --output text \
              --cli-connect-timeout 15 --cli-read-timeout 30) && [ -n "$CODEARTIFACT_AUTH_TOKEN" ]; then
              break
            fi
            echo "::warning::CodeArtifact get-authorization-token attempt ${attempt}/3 failed (connect/read timeout or empty token) — retrying in 5s"
            CODEARTIFACT_AUTH_TOKEN=""
            [ "$attempt" -lt 3 ] && sleep 5
          done
          if [ -z "$CODEARTIFACT_AUTH_TOKEN" ]; then
            echo "::error::CodeArtifact get-authorization-token FAILED after 3 attempts — CodeArtifact unreachable or token empty"
            exit 1
          fi
          export CODEARTIFACT_AUTH_TOKEN
          echo "UV_EXTRA_INDEX_URL=https://aws:${CODEARTIFACT_AUTH_TOKEN}@autom8y-696318035277.d.codeartifact.us-east-1.amazonaws.com/pypi/autom8y-python/simple/" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          # REL-005: pin + cache-suffix + prune-cache — see durations-refresh.yml
          # for the pin-source rationale (F5: no [tool.uv] constraint here).
          version: "0.12.1"
          cache-suffix: nightly-live-smoke
          prune-cache: false

      - name: Install dependencies
        # --no-sources: ignore [tool.uv.sources] monorepo-relative path overrides
        # and resolve autom8y-* from CodeArtifact. Mirrors the Test workflow.
        run: |
          uv pip install --system --no-sources '.[dev,api,auth,events]'
          uv pip install --system --no-sources --group dev

      - name: Run live-smoke suite (skip-gate satisfied; fail loud on skip)
        env:
          # Bridged pair (see cred-bridge step): the principal that CAN read
          # the durable cache. Step-scoped on purpose — nothing else needs it.
          AWS_ACCESS_KEY_ID: ${{ steps.credbridge.outputs.key }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.credbridge.outputs.secret }}
        run: |
          # The OIDC action exported a session token for the deploy role into
          # the job env. The bridged pair above is a long-lived key pair with
          # NO token — a stale AWS_SESSION_TOKEN next to it breaks SigV4, so
          # drop it for this step's children.
          unset AWS_SESSION_TOKEN
          # -p no:autom8y_config: the autom8y-config pytest11 plugin's AUTOUSE
          # config_clean_env fixture deletes AWS_* env at every test setup —
          # the 60-night NoCredentialsError root cause (see header). The
          # nightly is the designated NON-hermetic run; hermeticity stays on
          # in the Test workflow.
          # -o addopts="" drops the repo-wide --dist=loadgroup (needs xdist);
          # -p no:xdist runs in the main process. -rs surfaces skip reasons in
          # the summary so the assertion step below can detect a silent skip.
          # Tee to a log so the next step can grep the pytest summary line.
          set -o pipefail
          python -m pytest \
            tests/unit/cache/test_durable_task_cache_live_smoke.py \
            tests/unit/dataframes/builders/test_null_number_recovery_live_smoke.py \
            -p no:autom8y_config \
            -o addopts="" -o asyncio_mode=auto \
            -p no:xdist -p no:cacheprovider \
            -rs -v --no-header \
            2>&1 | tee /tmp/live-smoke.log

      - name: Assert smokes RAN (anti-theater forcing function)
        if: always()
        run: |
          # The whole point of this nightly: if the live smokes SKIP, the job must
          # FAIL. A nightly that silently skips is theater. We assert (a) zero
          # skipped outcomes and (b) at least the expected number of passes.
          #
          # Expected: 5 live-smoke tests (3 durable-reader + 2 cure-path).
          EXPECTED_PASSED=5
          LOG=/tmp/live-smoke.log

          if [ ! -s "$LOG" ]; then
            echo "::error::No pytest log produced — the run step failed before emitting a summary. Job FAILS."
            exit 1
          fi

          SUMMARY="$(grep -E '=+ .* (passed|failed|skipped|error).* =+' "$LOG" | tail -1)"
          echo "pytest summary: ${SUMMARY:-<none found>}"

          # (a) ANY skip => the forcing function caught a silent-skip. FAIL.
          if echo "$SUMMARY" | grep -qiE '[0-9]+ skipped'; then
            echo "::error::Live smokes SKIPPED — the skip gate was not satisfied (ASANA_CACHE_S3_BUCKET unset or AWS creds missing). A skipping nightly is theater; failing loud. Summary: $SUMMARY"
            exit 1
          fi

          # (b) Verify the expected number of tests actually PASSED.
          PASSED="$(echo "$SUMMARY" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' || echo 0)"
          if [ "${PASSED:-0}" -lt "$EXPECTED_PASSED" ]; then
            echo "::error::Expected >= ${EXPECTED_PASSED} live-smoke tests to PASS, saw ${PASSED:-0}. Either tests failed (AccessDenied on the durable-cache read => Layer-4 grant gap; see workflow header) or collection changed. Failing loud. Summary: $SUMMARY"
            exit 1
          fi

          echo "Live-smoke forcing function satisfied: ${PASSED} tests passed, 0 skipped."

      - name: Page on RED (red-detector alerting — meta-gap cure)
        # 60 red nights paged nobody: scheduled-run failures notify only
        # Actions-tab watchers. Publish every RED to the fleet's live alert
        # route (autom8y-platform-alerts -> Slack + email) via the cred-bridge.
        # HONEST LIMIT (pegged in the header): a failure BEFORE the cred-bridge
        # step has no credentials to page with.
        if: failure()
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.credbridge.outputs.key }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.credbridge.outputs.secret }}
        run: |
          unset AWS_SESSION_TOKEN
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::page-on-red: failure occurred before the cred-bridge step — no credentials to page with (header HONEST LIMIT); this RED was NOT paged"
            exit 1
          fi
          aws sns publish \
            --topic-arn "arn:aws:sns:us-east-1:696318035277:autom8y-platform-alerts" \
            --subject "RED: Nightly Live Smoke (autom8y-asana)" \
            --message "Nightly Live Smoke FAILED on ${GITHUB_REF_NAME}. The live durable-cache read smoke is RED — treat as a real Layer-4 signal (see workflow header). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "page-on-red: published to autom8y-platform-alerts"
