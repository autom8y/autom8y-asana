name: Satellite Dispatch

# S02-C1 (2026-09-02): a single autom8y-core SDK publish caused 10 unrequested
# satellite builds, 4 terraform applies and 6 ECS deploys with ZERO operator
# words. Two independent legs of this workflow were the cause:
#
#   1. `sdk-publish-v2.yml`'s consumer-gate fires this satellite's `test.yml`
#      via workflow_dispatch on `main` and polls it, blocking publish on
#      failure. The resulting `Test` completion arrives here as a workflow_run
#      on main with conclusion=success -- under the old `if:` indistinguishable
#      from a real merge. A gate-VALIDATION run must never deploy.
#   2. `sdk-publish-v2.yml`'s `Notify Satellite Repos` job sends
#      `repository_dispatch: sdk-published`, which this workflow also accepted
#      and turned into a deploy -- of the satellite's UNCHANGED main, because
#      the lockfile bump it announces is still an unmerged PR. A pure no-op
#      roll with real blast radius.
#
# Fix per R-26 (.ledge/decisions/RATIFICATION-shared-front-sitting-2026-09-03.md):
#   (i)   the workflow_run leg fires ONLY when the completed Test run was
#         itself triggered by a push to main;
#   (ii)  the `sdk-published` repository_dispatch trigger is REMOVED. It had no
#         behaviour beyond dispatching the deploy: the lockfile bump it
#         announces is opened as a PR by the MONOREPO's own lockfile-propagator
#         (sdk-publish-v2.yml, "Propagate lockfile bumps to satellites"), not by
#         anything here. That PR lands as a normal push to main and deploys via
#         leg (i) -- when the bump is actually IN the tree. Nothing is lost.
#   (iii) `triggered_by` is READ from the real event instead of falling through
#         an `else: push` that mislabelled gate dispatches as pushes.

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

# Serialize asana satellite deploys: stacked dispatches (sdk-published +
# main-branch Test-success + manual workflow_dispatch can fire near-simultaneously)
# previously raced the downstream a8 deploy, re-registering competing task
# definitions. cancel-in-progress: false queues a new dispatch behind any
# in-flight one rather than cancelling a mid-canary deploy. Asana-scoped — this
# workflow only ever dispatches the asana service.
concurrency:
  group: asana-satellite-deploy
  cancel-in-progress: false

jobs:
  dispatch:
    timeout-minutes: 5
    # Deploy on exactly two events:
    #   - a PUSH-triggered Test success on main (a real merge), or
    #   - an explicit manual workflow_dispatch of THIS workflow.
    # Every other completed Test run -- consumer-gate workflow_dispatch,
    # schedule, pull_request, re-run -- is refused. `workflow_run.event` is the
    # TRIGGERING run's own event and is the discriminator the old gate lacked.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 (node24)
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: autom8y
          repositories: autom8y

      - name: Determine trigger type
        id: trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          case "${EVENT_NAME}" in
            workflow_run)
              # Emit the UPSTREAM run's own event VERBATIM. The `if:` above
              # admits only 'push', so this reads "push" today -- but it is
              # read, never asserted, so the provenance label can no longer
              # claim a push that did not happen (the S02-C1 mislabel).
              echo "triggered_by=${UPSTREAM_EVENT}" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "triggered_by=workflow_dispatch" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Unreachable under the `on:` block above. Surface the real event
              # loudly rather than inheriting a false label.
              echo "triggered_by=unknown-${EVENT_NAME}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Dispatch to autom8y
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: autom8y/autom8y
          event-type: satellite-deploy
          client-payload: |
            {
              "service_name": "asana",
              "satellite_repo": "autom8y-asana",
              "ref": "${{ github.event.workflow_run.head_branch || github.ref_name }}",
              "sha": "${{ github.event.workflow_run.head_sha || github.sha }}",
              "triggered_by": "${{ steps.trigger.outputs.triggered_by }}"
            }

      - name: Log dispatch success
        run: |
          echo "Successfully dispatched satellite-deploy event to autom8y/autom8y"
          echo "  Service: asana"
          echo "  Repository: autom8y-asana"
          echo "  Ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}"
          echo "  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "  Triggered by: ${{ steps.trigger.outputs.triggered_by }}"
